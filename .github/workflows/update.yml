name: Update snowfall ensemble dashboard

# Release times of the 00 / 12 UTC runs (the common cycle of EPS, GEFS and GEPS):
#   GEFS ~4.5-5 h, GEPS ~5-6 h and ECMWF ENS (EPS) ~7.7-8 h after the run time.
# The first attempt is at +8h30; two retries follow in case EPS is late.  An attempt that finds the live site already showing the
# newest runs (built by the same code) exits after about a minute without touching Pages (--skip-if-deployed).
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 8,20 * * *"
    - cron: "30 9,10,21,22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the live site already shows the newest runs"
        type: boolean
        default: false
      probe:
        description: "Only report which runs are on the servers (first-time check of the data sources); builds nothing"
        type: boolean
        default: false
      ensembles:
        description: "Comma-separated systems to build"
        default: "eps,gefs,geps"
      max_fhr:
        description: "Last forecast hour (multiple of 6)"
        default: "168"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write               # keep-alive step only

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    outputs:
      publish: ${{ steps.build.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - run: python -m ensemble_snow.build --probe --ensembles "${{ inputs.ensembles || 'eps,gefs,geps' }}" --max-fhr "${{ inputs.max_fhr || '168' }}"
        if: inputs.probe
        continue-on-error: true

      # Natural Earth downloads (~40 MB, once).  Model data is never cached or committed: it is fetched, reduced to the New England
      # display grid, and only the result is published.
      - uses: actions/cache@v4
        if: ${{ !inputs.probe }}
        with:
          path: .cache
          key: static-v1-${{ hashFiles('ensemble_snow/gis.py') }}
          restore-keys: static-v1-

      - name: Build site
        id: build
        if: ${{ !inputs.probe }}
        env:
          FORCE: ${{ inputs.force }}
          ENSEMBLES: ${{ inputs.ensembles || 'eps,gefs,geps' }}
          MAX_FHR: ${{ inputs.max_fhr || '168' }}
          TQDM_DISABLE: "1"          # no download progress bars: they made the log ~100x larger and hid the real messages
        run: |
          pages_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          skip=(--skip-if-deployed "$pages_url")
          [ "$FORCE" = "true" ] && skip=()
          python -m ensemble_snow.build --out public --cache .cache --ensembles "$ENSEMBLES" --max-fhr "$MAX_FHR" "${skip[@]}"
          if [ -f public/index.html ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; else echo "publish=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/configure-pages@v5
        if: steps.build.outputs.publish == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.publish == 'true'
        with:
          path: public

      # GitHub pauses scheduled workflows in a public repository after 60 days without activity; re-enabling resets the timer.
      - name: Keep the schedule alive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/enable"

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
