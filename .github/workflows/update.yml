name: Update snowfall ensemble dashboard

# Release times of the 00 / 12 UTC runs (the common cycle of EPS, GEFS and GEPS):
#   GEFS ~4.5-5 h, GEPS ~5-6 h and ECMWF ENS (EPS) ~7.7-8 h after the run time.
# The first attempt is at +8h30; two retries follow in case EPS is late.  An attempt that finds the live site already showing the
# newest runs (built by the same code) exits after about a minute without touching Pages (--skip-if-deployed).
on:
  push:
    branches: [main]
    # Uploads that cannot change the site (docs, tests) no longer start a build, so they cannot queue behind or cancel a real one.
    paths-ignore:
      - "**.md"
      - "tests/**"
      - "LICENSE"
      - ".gitignore"
  schedule:
    - cron: "30 8,20 * * *"
    - cron: "30 9,10,21,22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the live site already shows the newest runs"
        type: boolean
        default: false
      probe:
        description: "Only report which runs are on the servers (first-time check of the data sources); builds nothing"
        type: boolean
        default: false
      ensembles:
        description: "Comma-separated systems to build"
        default: "eps,gefs,geps"
      max_fhr:
        description: "Last forecast hour (multiple of 6)"
        default: "168"
      blend_weights:
        description: "Weights of the systems in the combined view: equal (default), members (by member count) or e.g. eps=50,gefs=30,geps=20"
        default: "equal"
      fresh_data:
        description: "Ignore the cached model downloads and finished data files and fetch everything again"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write               # keep-alive step only

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    outputs:
      publish: ${{ steps.build.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - run: python -m ensemble_snow.build --probe --ensembles "${{ inputs.ensembles || 'eps,gefs,geps' }}" --max-fhr "${{ inputs.max_fhr || '168' }}"
        if: inputs.probe
        continue-on-error: true

      # Natural Earth downloads (~40 MB, once).
      - uses: actions/cache@v4
        if: ${{ !inputs.probe }}
        with:
          path: |
            .cache/ne
            .cache/dem
          key: static-v3-${{ hashFiles('ensemble_snow/gis.py', 'ensemble_snow/terrain.py') }}
          restore-keys: static-v3-

      # Model data kept between runs so that a change to the page (or to the statistics) does not download the model again:
      #   .cache/decoded  the newest EPS / GEFS / GEPS download already reduced to the New England grid (~100-200 MB instead of ~18 GB of GRIB)
      #   .cache/bundles  the finished data files of the last build (~10 MB), reused when only the page changed
      #   .cache/parts    GEPS forecast hours already downloaded, so an attempt that failed half way resumes instead of starting over
      # GitHub caches are immutable, so every run that changes the data saves a new snapshot; the newest one is restored and GitHub
      # evicts the oldest ones on its own.  Nothing of this is committed or published.
      - name: Restore cached model data
        if: ${{ !inputs.probe }}
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/decoded
            .cache/bundles
            .cache/parts
          key: data-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: data-${{ runner.os }}-

      - name: Remember what the cache holds
        id: cache_before
        if: ${{ !inputs.probe }}
        run: echo "sig=$(find .cache/decoded .cache/bundles .cache/parts -type f -printf '%p %s\n' 2>/dev/null | sort | sha1sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Build site
        id: build
        if: ${{ !inputs.probe }}
        env:
          FORCE: ${{ inputs.force }}
          FRESH: ${{ inputs.fresh_data }}
          ENSEMBLES: ${{ inputs.ensembles || 'eps,gefs,geps' }}
          MAX_FHR: ${{ inputs.max_fhr || '168' }}
          BLEND_WEIGHTS: ${{ inputs.blend_weights || 'equal' }}
          TQDM_DISABLE: "1"          # no download progress bars: they made the log ~100x larger and hid the real messages
        run: |
          pages_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          skip=(--skip-if-deployed "$pages_url")
          [ "$FORCE" = "true" ] && skip=()
          [ "$FRESH" = "true" ] && skip+=(--no-cache)
          python -m ensemble_snow.build --out public --cache .cache --ensembles "$ENSEMBLES" --max-fhr "$MAX_FHR" --blend-weights "$BLEND_WEIGHTS" "${skip[@]}"
          if [ -f public/index.html ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; else echo "publish=false" >> "$GITHUB_OUTPUT"; fi

      # Save the model data even when a later step failed (a retry then does not download again).  Skipped when nothing changed.
      - name: Check whether the cache changed
        id: cache_after
        if: ${{ always() && !inputs.probe }}
        run: |
          now=$(find .cache/decoded .cache/bundles .cache/parts -type f -printf '%p %s\n' 2>/dev/null | sort | sha1sum | cut -c1-16)
          if [ "$now" != "${{ steps.cache_before.outputs.sig }}" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save model data for the next run
        if: ${{ always() && !inputs.probe && steps.cache_after.outputs.changed == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/decoded
            .cache/bundles
            .cache/parts
          key: data-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/configure-pages@v5
        if: steps.build.outputs.publish == 'true'

      - name: Size of the site
        if: steps.build.outputs.publish == 'true'
        run: |
          du -sh public
          echo "$(find public -type f | wc -l) files"

      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.publish == 'true'
        with:
          path: public

      # GitHub pauses scheduled workflows in a public repository after 60 days without activity; re-enabling resets the timer.
      - name: Keep the schedule alive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/enable"

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    timeout-minutes: 60
    steps:
      # Publishing the artifact normally takes under a minute, but GitHub Pages sometimes stalls after "finished_file_sync" and the action gives up
      # (10 minutes by default; the build that took 50 minutes was then lost).  A second attempt creates a fresh deployment from the same artifact
      # and usually goes straight through, so the first attempt is not allowed to fail the job and the second one is.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 600000

      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 1500000
